# World view: how the game world is shown in text. Keys left out take the defaults in api_player/presentation.py.
name = "bare"
description = "The original grid and the object list only: no legend lines, no fences list, no floor rows."

# How to read it; it replaces {view_help} in the general prompt.
help = '''
- On the map every tile is two characters wide (a slot for a fence on its left, then the tile). The column number (x) is written top-to-bottom above and below each column; the row number (y) is at both ends of each row.
- The symbols line says what each symbol is. Only objects at your height are drawn.
- `|` between two tiles and `-` between two rows are fences: a fence is not a tile, it sits on the edge between two tiles and blocks the way like a wall.
'''

[view]
legend = false
fence_list = false
floor_rows = false
